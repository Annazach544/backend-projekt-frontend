<header>
  <h1>Boka bord</h1>
  <p>Planera ditt besök hos Bistro Anna</p>
</header>

<section class="booking">
  <h2>Skicka en bokningsförfrågan</h2>

  <form>
    <input type="text" placeholder="Namn">
    <input type="tel" placeholder="Telefonnummer">
    <input type="date">
    <input type="time">
    <input type="number" placeholder="Antal personer">

    <textarea placeholder="Meddelande"></textarea>

    <button type="button" (click)="sendBooking()">
  Skicka förfrågan
    </button>

    <p>{{ message }}</p>

  </form>
</section>
