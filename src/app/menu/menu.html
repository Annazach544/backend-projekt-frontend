<header>
  <h1>Vår meny</h1>
  <p>Italienska rätter med färska råvaror och klassiska smaker</p>
</header>

<section class="restaurant-menu">

  <div class="menu-section" *ngFor="let category of categories">

    <h2>{{ category }}</h2>

    <div class="menu-row" *ngFor="let item of getItemsByCategory(category)">

      <div class="menu-text">
        <h3>{{ item.title }}</h3>
        <p>{{ item.description }}</p>
      </div>

      <span>{{ item.price }} kr</span>

    </div>

    <p class="info-text">
    För beställning eller bokning, kontakta restaurangen via telefon.
    </p>
  
</div>

</section>

<footer>
  <p><a routerLink="/">Tillbaka till startsidan</a></p>
</footer>
